acl_policies:
  - id: "ACL-STUDENT-ACCESS"
    name: "Student Examination & Core Services Access Policy"
    source_vlans: [10, 20, 30]
    rules:
      - action: "permit"
        protocol: "tcp"
        destination: "10.20.10.210"
        port: 443
        description: "Allow HTTPS to Exam Service VIP"
      - action: "permit"
        protocol: "tcp"
        destination: "10.20.10.210"
        port: 80
        description: "Allow HTTP to Exam Service VIP"
      - action: "permit"
        protocol: "udp"
        destination: "10.20.10.202"
        port: 53
        description: "Allow DNS to DHCP-DNS-1"
      - action: "permit"
        protocol: "udp"
        destination: "10.20.10.203"
        port: 53
        description: "Allow DNS to DHCP-DNS-2"
      - action: "permit"
        protocol: "udp"
        destination: "255.255.255.255"
        port: 67
        description: "Allow DHCP discovery"
      - action: "deny"
        protocol: "ip"
        destination: "10.20.11.32/27"
        description: "Block all Student access to Network Management VLAN 70"
      - action: "permit"
        protocol: "icmp"
        destination: "10.20.10.0/23"
        description: "Allow campus diagnostic ping"

  - id: "ACL-GUEST-ISOLATION"
    name: "Guest Network Total Campus Isolation Policy"
    source_vlans: [80]
    rules:
      - action: "deny"
        protocol: "ip"
        destination: "10.20.10.0/23"
        description: "Block Guest access to all internal campus subnets"
      - action: "permit"
        protocol: "udp"
        destination: "10.20.10.202"
        port: 53
        description: "Permit DNS resolution"
      - action: "permit"
        protocol: "udp"
        destination: "10.20.10.203"
        port: 53
        description: "Permit DNS resolution"
      - action: "permit"
        protocol: "ip"
        destination: "198.51.100.0/24"
        description: "Permit Guest outbound access to external simulated internet"

fault_scenarios:
  - id: "F01"
    name: "Normal Baseline Network Operation"
    description: "All routers, switches, links, and redundant services operating nominally under baseline conditions."
    target_device: "NONE"
    target_interface: "NONE"
    action: "verify_baseline"
    expected_outcome: "All pings, DNS queries, DHCP allocations, HTTP requests, OSPF adjacencies, and VRRP gateway states pass 100%."
    recovery_action: "none"

  - id: "F02"
    name: "Primary Distribution Switch Failure (DSW1 Down)"
    description: "Complete power or hardware failure of DSW1, testing first-hop VRRP takeover and RSTP reconvergence."
    target_device: "DSW1"
    target_interface: "ALL"
    action: "stop_node"
    expected_outcome: "DSW2 claims VRRP VIPs for VLAN 10, 30, 50, 70. Client traffic recovers in < 3s."
    recovery_action: "start_node"

  - id: "F03"
    name: "Secondary Distribution Switch Failure (DSW2 Down)"
    description: "Failure of secondary switch DSW2, testing VLAN 20, 40, 60, 80 takeover by DSW1."
    target_device: "DSW2"
    target_interface: "ALL"
    action: "stop_node"
    expected_outcome: "DSW1 takes over server, lab B, and faculty gateways seamlessly."
    recovery_action: "start_node"

  - id: "F04"
    name: "Access Switch Uplink Failure"
    description: "Severing primary trunk uplink from ASW-LA-1 to DSW1, verifying RSTP unblocking."
    target_device: "ASW-LA-1"
    target_interface: "eth1"
    action: "link_down"
    expected_outcome: "RSTP transitions redundant port to DSW2 from Alternate/Discarding to Forwarding."
    recovery_action: "link_up"

  - id: "F05"
    name: "Individual Access Switch Failure"
    description: "Failure of ASW-LA-1, verifying that paired switch ASW-LA-2 maintains lab uptime."
    target_device: "ASW-LA-1"
    target_interface: "ALL"
    action: "stop_node"
    expected_outcome: "Hosts on ASW-LA-1 lose connectivity; hosts on ASW-LA-2 continue uninterrupted."
    recovery_action: "start_node"

  - id: "F06"
    name: "Campus Edge Router Failure (EDGE-R1 Down)"
    description: "Failure of EDGE-R1, validating OSPF routing reconvergence toward EDGE-R2."
    target_device: "EDGE-R1"
    target_interface: "ALL"
    action: "stop_node"
    expected_outcome: "OSPF withdraws EDGE-R1 routes; DSW1 and DSW2 forward external traffic via EDGE-R2."
    recovery_action: "start_node"

  - id: "F07"
    name: "Routed Point-to-Point Uplink Failure"
    description: "Failure of DSW1-to-EDGE-R1 routed link (10.20.255.8/30)."
    target_device: "DSW1"
    target_interface: "eth1"
    action: "interface_down"
    expected_outcome: "OSPF routes DSW1 traffic through DSW1-EDGE-R2 (10.20.255.12/30) alternate path."
    recovery_action: "interface_up"

  - id: "F08"
    name: "Primary Examination Server Failure"
    description: "Web daemon crash on EXAM-WEB-1, validating VRRP Service VIP (10.20.10.210) failover to EXAM-WEB-2."
    target_device: "EXAM-WEB-1"
    target_interface: "http_service"
    action: "stop_service"
    expected_outcome: "Keepalived triggers VIP migration to EXAM-WEB-2; HTTP requests continue to succeed."
    recovery_action: "start_service"

  - id: "F09"
    name: "Primary DHCP and DNS Server Failure"
    description: "Failure of DHCP-DNS-1, verifying DHCP Pool B and secondary DNS on DHCP-DNS-2."
    target_device: "DHCP-DNS-1"
    target_interface: "ALL"
    action: "stop_node"
    expected_outcome: "New clients receive DHCP lease from DHCP-DNS-2; DNS queries continue via secondary server."
    recovery_action: "start_node"

  - id: "F10"
    name: "Link Impairment (Packet Loss & Latency Injection)"
    description: "Injecting 10% packet loss and 50ms jitter on server uplink using Linux tc netem."
    target_device: "DSW1"
    target_interface: "eth0"
    action: "apply_netem"
    netem_params: "loss 10% delay 50ms 10ms"
    expected_outcome: "Observed ping packet loss and TCP retransmissions visible in captured traffic."
    recovery_action: "clear_netem"

  - id: "F11"
    name: "Guest ACL Isolation Verification"
    description: "Enforcing and auditing ACL rule blocking Guest PC from accessing examination server VIP."
    target_device: "DSW1"
    target_interface: "vlan80"
    action: "test_acl_drop"
    expected_outcome: "Guest ping/HTTP to 10.20.10.210 is explicitly dropped by packet filter."
    recovery_action: "restore_baseline"

  - id: "F12"
    name: "Dynamic Host Scaling in Existing Lab"
    description: "Provisioning an additional student endpoint in Lab A and verifying DHCP DORA assignment."
    target_device: "PC-LA-03"
    target_interface: "eth0"
    action: "add_client"
    expected_outcome: "New client leases valid IP from pool; subnet headroom confirmed."
    recovery_action: "remove_client"

  - id: "F13"
    name: "Campus Expansion: Additional Examination Lab D"
    description: "Allocating next reserved /26 (10.20.11.96/26) as VLAN 90 (LAB-D)."
    target_device: "LAB-D"
    target_interface: "NEW_VLAN"
    action: "provision_lab_d"
    expected_outcome: "New lab allocated without address conflicts or redeployment disruptions."
    recovery_action: "deprovision_lab_d"

  - id: "F14"
    name: "Simulated ISP Upstream Failure"
    description: "Failure of ISP1 router, isolating campus from external test network."
    target_device: "ISP1"
    target_interface: "ALL"
    action: "stop_node"
    expected_outcome: "External test server becomes unreachable; internal exam portal remains 100% operational."
    recovery_action: "start_node"

