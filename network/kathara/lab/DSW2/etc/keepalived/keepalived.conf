global_defs {
    router_id DSW2
    enable_script_security
}

vrrp_instance VI_10 {
    state BACKUP
    interface vlan10
    virtual_router_id 10
    priority 90
    advert_int 1
    virtual_ipaddress {
        10.20.10.1/26
    }
}

