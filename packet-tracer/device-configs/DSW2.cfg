hostname DSW2
ip routing
no ip domain-lookup
spanning-tree mode rapid-pvst
!
spanning-tree vlan 20,40,60,80 root primary
spanning-tree vlan 10,30,50,70 root secondary
!
vlan 10
 name LAB-A
!
vlan 20
 name LAB-B
!
vlan 30
 name LAB-C
!
vlan 40
 name SERVERS
!
vlan 50
 name ADMIN
!
vlan 60
 name FACULTY
!
vlan 70
 name NET-MGMT
!
vlan 80
 name GUEST
!
interface GigabitEthernet0/1
 description Inter-Switch Trunk to DSW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface GigabitEthernet0/2
 description Routed Link to EDGE-R1
 no switchport
 ip address 10.20.255.17 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface FastEthernet0/24
 description Routed Link to EDGE-R2
 no switchport
 ip address 10.20.255.21 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface FastEthernet0/1
 description Trunk Uplink to ASW-LA-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/2
 description Trunk Uplink to ASW-LA-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/3
 description Trunk Uplink to ASW-LB-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/4
 description Trunk Uplink to ASW-LB-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/5
 description Trunk Uplink to ASW-LC-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/6
 description Trunk Uplink to ASW-LC-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/7
 description Trunk Uplink to ASW-SRV-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/8
 description Trunk Uplink to ASW-SRV-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/9
 description Trunk Uplink to ASW-ADM-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface FastEthernet0/10
 description Trunk Uplink to ASW-ADM-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 no shutdown
!
interface Vlan10
 description LAB-A Gateway SVI
 ip address 10.20.10.3 255.255.255.192
 standby 10 ip 10.20.10.1
 standby 10 priority 90
 standby 10 preempt
 ip helper-address 10.20.10.202
 ip helper-address 10.20.10.203
 no shutdown
!
interface Vlan20
 description LAB-B Gateway SVI
 ip address 10.20.10.67 255.255.255.192
 standby 20 ip 10.20.10.65
 standby 20 priority 110
 standby 20 preempt
 ip helper-address 10.20.10.202
 ip helper-address 10.20.10.203
 no shutdown
!
interface Vlan30
 description LAB-C Gateway SVI
 ip address 10.20.10.131 255.255.255.192
 standby 30 ip 10.20.10.129
 standby 30 priority 90
 standby 30 preempt
 ip helper-address 10.20.10.202
 ip helper-address 10.20.10.203
 no shutdown
!
interface Vlan40
 description SERVERS Gateway SVI
 ip address 10.20.10.195 255.255.255.224
 standby 40 ip 10.20.10.193
 standby 40 priority 110
 standby 40 preempt
 no shutdown
!
interface Vlan50
 description ADMIN Gateway SVI
 ip address 10.20.10.227 255.255.255.224
 standby 50 ip 10.20.10.225
 standby 50 priority 90
 standby 50 preempt
 ip helper-address 10.20.10.202
 ip helper-address 10.20.10.203
 no shutdown
!
interface Vlan60
 description FACULTY Gateway SVI
 ip address 10.20.11.3 255.255.255.224
 standby 60 ip 10.20.11.1
 standby 60 priority 110
 standby 60 preempt
 ip helper-address 10.20.10.202
 ip helper-address 10.20.10.203
 no shutdown
!
interface Vlan70
 description NET-MGMT Gateway SVI
 ip address 10.20.11.35 255.255.255.224
 standby 70 ip 10.20.11.33
 standby 70 priority 90
 standby 70 preempt
 no shutdown
!
interface Vlan80
 description GUEST Gateway SVI
 ip address 10.20.11.67 255.255.255.224
 standby 80 ip 10.20.11.65
 standby 80 priority 110
 standby 80 preempt
 ip helper-address 10.20.10.202
 ip helper-address 10.20.10.203
 no shutdown
!
router ospf 1
 router-id 10.20.255.17
 network 10.20.10.0 0.0.1.255 area 0
 passive-interface default
 no passive-interface GigabitEthernet0/2
 no passive-interface FastEthernet0/24
!
ip access-list extended ACL-STUDENT-ACCESS
 permit tcp 10.20.10.0 0.0.0.191 host 10.20.10.210 eq 443
 permit tcp 10.20.10.0 0.0.0.191 host 10.20.10.210 eq 80
 permit udp 10.20.10.0 0.0.0.191 host 10.20.10.202 eq 53
 permit udp 10.20.10.0 0.0.0.191 host 10.20.10.203 eq 53
 permit udp any eq 68 any eq 67
 deny ip 10.20.10.0 0.0.0.191 10.20.11.32 0.0.0.31
 permit icmp 10.20.10.0 0.0.0.191 10.20.10.0 0.0.1.255
!
ip access-list extended ACL-GUEST-ISOLATION
 deny ip 10.20.11.64 0.0.0.31 10.20.10.0 0.0.1.255
 permit udp 10.20.11.64 0.0.0.31 host 10.20.10.202 eq 53
 permit udp 10.20.11.64 0.0.0.31 host 10.20.10.203 eq 53
 permit ip 10.20.11.64 0.0.0.31 198.51.100.0 0.0.0.255
!
line con 0
 logging synchronous
line vty 0 4
 login
end